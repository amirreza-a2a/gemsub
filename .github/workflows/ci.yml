name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Verify whitespace (git diff --check)
        run: git diff --check

      - name: Static analysis (go vet)
        run: go vet -tags with_utls ./...

      - name: Unit tests
        run: go test -tags with_utls -count=1 -p 1 ./...

      # internal/tester is excluded from the race detector gate due to the known upstream sing-box interface-monitor data race tracked as TD-008
      - name: Race detector
        run: go test -tags with_utls -race -count=1 ./cmd/gemsub ./internal/config ./internal/scheduler ./internal/publisher ./internal/source ./internal/store ./internal/subserver ./internal/tui

      - name: Build
        run: go build -tags with_utls ./cmd/gemsub

      - name: Cross-build Windows (amd64 and arm64)
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags with_utls -o /dev/null ./cmd/gemsub
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -tags with_utls -o /dev/null ./cmd/gemsub

  validate-windows:
    name: Validate Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Static analysis (go vet)
        run: go vet -tags with_utls ./...

      - name: Unit tests
        run: go test -tags with_utls -count=1 -p 1 ./...

      - name: Build
        run: go build -tags with_utls ./cmd/gemsub
